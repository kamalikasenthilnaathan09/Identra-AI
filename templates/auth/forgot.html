{% extends "base.html" %}

{% block title %}Reset Password - Identra AI{% endblock %}

{% block content %}
<div style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem;">
    <div class="glass-card" style="width: 100%; max-width: 420px; padding: 2.5rem; text-align: center; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);">
        
        <a href="/" class="logo" style="justify-content: center; margin-bottom: 2rem;">
            <i class="fa-solid fa-brain"></i> Identra AI
        </a>
        
        <h2 style="font-size: 1.6rem; margin-bottom: 0.5rem;">Recover Node Key</h2>
        <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 2rem;">Reset password credentials via verified email node.</p>
        
        <form action="{{ url_for('auth.forgot') }}" method="POST" style="text-align: left; display: flex; flex-direction: column; gap: 1.25rem;">
            
            <div style="display: flex; flex-direction: column; gap: 0.4rem;">
                <label for="email" style="font-size: 0.85rem; font-weight: 600; color: var(--text-secondary);">Email Address</label>
                <div style="position: relative;">
                    <i class="fa-solid fa-envelope" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
                    <input type="email" id="email" name="email" required placeholder="alex@rivera.com" 
                           style="width: 100%; padding: 0.75rem 1rem 0.75rem 2.5rem; background: rgba(255,255,255,0.03); border: 1px solid var(--border-subtle); border-radius: 8px; color: #fff; outline: none; transition: border var(--transition-fast);">
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.8rem; margin-top: 1rem; font-size: 0.95rem;">Send Recovery Email</button>
        </form>
        
        <p style="margin-top: 2rem; font-size: 0.85rem; color: var(--text-muted);">
            Remembered details? <a href="{{ url_for('auth.login') }}" style="color: var(--neon-cyan); font-weight: 600;">Back to Login</a>
        </p>
    </div>
</div>

<script>
    document.querySelectorAll('input').forEach(input => {
        input.addEventListener('focus', () => {
            input.style.borderColor = 'var(--neon-cyan)';
            input.style.boxShadow = '0 0 10px rgba(0, 212, 255, 0.2)';
        });
        input.addEventListener('blur', () => {
            input.style.borderColor = 'var(--border-subtle)';
            input.style.boxShadow = 'none';
        });
    });
</script>
{% endblock %}

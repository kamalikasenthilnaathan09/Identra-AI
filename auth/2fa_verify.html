{% extends "base.html" %}

{% block title %}2FA Authentication - Identra AI{% endblock %}

{% block content %}
<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem;">
    <div class="glass-card" style="width: 100%; max-width: 440px; padding: 2.5rem; border-radius: 20px; text-align: center;" data-aos="zoom-in">
        <div style="width: 60px; height: 60px; border-radius: 50%; background: rgba(99, 102, 241, 0.15); color: var(--accent-indigo); display: flex; align-items: center; justify-content: center; font-size: 1.8rem; margin: 0 auto 1.25rem;">
            <i class="fa-solid fa-shield-halved"></i>
        </div>
        
        <h2 style="font-size: 1.5rem; font-weight: 700; color: #fff; margin-bottom: 0.4rem;">2FA Verification Required</h2>
        <p style="font-size: 0.88rem; color: var(--text-muted); margin-bottom: 1.8rem;">Enter the 6-digit verification code from your authenticator app (or use test code <strong>123456</strong>).</p>

        <form id="2fa-verify-form" onsubmit="handle2FAVerify(event)">
            <div style="display: flex; justify-content: center; gap: 8px; margin-bottom: 1.8rem;">
                <input type="text" maxlength="1" class="otp-input" autofocus onkeyup="moveOtpFocus(this, 1)" style="width: 45px; height: 52px; font-size: 1.4rem; text-align: center; border-radius: 10px; background: rgba(255,255,255,0.03); border: 1px solid var(--border-subtle); color: #fff; font-weight: 700;">
                <input type="text" maxlength="1" class="otp-input" onkeyup="moveOtpFocus(this, 2)" style="width: 45px; height: 52px; font-size: 1.4rem; text-align: center; border-radius: 10px; background: rgba(255,255,255,0.03); border: 1px solid var(--border-subtle); color: #fff; font-weight: 700;">
                <input type="text" maxlength="1" class="otp-input" onkeyup="moveOtpFocus(this, 3)" style="width: 45px; height: 52px; font-size: 1.4rem; text-align: center; border-radius: 10px; background: rgba(255,255,255,0.03); border: 1px solid var(--border-subtle); color: #fff; font-weight: 700;">
                <input type="text" maxlength="1" class="otp-input" onkeyup="moveOtpFocus(this, 4)" style="width: 45px; height: 52px; font-size: 1.4rem; text-align: center; border-radius: 10px; background: rgba(255,255,255,0.03); border: 1px solid var(--border-subtle); color: #fff; font-weight: 700;">
                <input type="text" maxlength="1" class="otp-input" onkeyup="moveOtpFocus(this, 5)" style="width: 45px; height: 52px; font-size: 1.4rem; text-align: center; border-radius: 10px; background: rgba(255,255,255,0.03); border: 1px solid var(--border-subtle); color: #fff; font-weight: 700;">
                <input type="text" maxlength="1" class="otp-input" onkeyup="moveOtpFocus(this, 6)" style="width: 45px; height: 52px; font-size: 1.4rem; text-align: center; border-radius: 10px; background: rgba(255,255,255,0.03); border: 1px solid var(--border-subtle); color: #fff; font-weight: 700;">
            </div>

            <button type="submit" id="btn-verify-2fa" class="btn btn-primary" style="width: 100%; padding: 0.85rem; font-size: 0.95rem; font-weight: 600; border-radius: 12px; margin-bottom: 1rem;">
                <i class="fa-solid fa-lock"></i> Verify & Access Console
            </button>
        </form>

        <div style="font-size: 0.82rem; color: var(--text-muted);">
            <a href="/auth/login" style="color: var(--accent-cyan); text-decoration: none;"><i class="fa-solid fa-arrow-left"></i> Back to Login</a>
        </div>
    </div>
</div>

<script>
function moveOtpFocus(input, index) {
    if (input.value.length === 1 && index < 6) {
        document.querySelectorAll('.otp-input')[index].focus();
    }
}

function handle2FAVerify(e) {
    e.preventDefault();
    const inputs = document.querySelectorAll('.otp-input');
    let code = '';
    inputs.forEach(i => code += i.value);
    
    if (code.length < 6) {
        if (typeof showToast === 'function') showToast('error', 'Please enter all 6 digits of your 2FA code.');
        return;
    }

    const btn = document.getElementById('btn-verify-2fa');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Verifying...';

    fetch('/api/2fa/verify-code', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code: code })
    })
    .then(res => res.json())
    .then(data => {
        if (data.success) {
            if (typeof showToast === 'function') showToast('success', '2FA Authentication Successful!');
            setTimeout(() => window.location.href = data.redirect_url, 800);
        } else {
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-lock"></i> Verify & Access Console';
            if (typeof showToast === 'function') showToast('error', data.error || 'Verification failed.');
        }
    })
    .catch(err => {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-lock"></i> Verify & Access Console';
        if (typeof showToast === 'function') showToast('error', 'Network error verifying 2FA code.');
    });
}
</script>
{% endblock %}
